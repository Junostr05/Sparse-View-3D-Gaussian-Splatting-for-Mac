name: CI

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test SplatCore and SplatIO
        working-directory: SplatKit
        run: swift test

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test SplatKit (including SplatMetal)
        working-directory: SplatKit
        run: swift test
