name: Sparse-view benchmark

# Manual only: trains every sparse-view configuration on the macOS runner (paravirtual GPU) and uploads the table.
on:
  workflow_dispatch:
    inputs:
      perturb:
        description: "Perturb the training views (exposure, camera error) for the v1.2 feature rows"
        type: boolean
        default: false

jobs:
  benchmark:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run sparse-view benchmark
        working-directory: SplatKit
        env:
          SPLAT_BENCHMARK: "1"
          SPLAT_BENCHMARK_PERTURB: ${{ inputs.perturb && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/benchmark"
          swift test -c release --filter SparseViewBenchmark 2>&1 | tee "$RUNNER_TEMP/benchmark/benchmark-output.txt"
      - name: Extract Markdown table
        if: always()
        run: |
          grep '^|' "$RUNNER_TEMP/benchmark/benchmark-output.txt" > "$RUNNER_TEMP/benchmark/benchmark-table.md" || true
          cat "$RUNNER_TEMP/benchmark/benchmark-table.md" || true
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparse-view-benchmark
          path: ${{ runner.temp }}/benchmark
          retention-days: 30
